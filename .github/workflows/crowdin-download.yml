name: Crowdin - Download translations

on:
  schedule:
    - cron: "0 12 * * *" # todo dia às 12:00 UTC — ajuste se quiser outra cadência
  workflow_dispatch:

jobs:
  download-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download translations from Crowdin and open PR
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n/crowdin-translations
          create_pull_request: true
          pull_request_title: "chore(l10n): atualiza traduções via Crowdin"
          pull_request_body: "Traduções baixadas automaticamente do Crowdin. Depois de mergear, abra a Unity e rode **NakeDev > Localization > Import All Collections from CSV**."
          commit_message: "chore(l10n): sync translations from Crowdin"
          config: "crowdin.yml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
